<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비서 시리즈</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 20px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.7; background: #0e0f11; color: #f2efe9;
    display: flex; justify-content: center;
  }
  main { max-width: 600px; width: 100%; }
  h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #9a9891; margin: 0 0 40px; font-size: 15px; }
  .app {
    border-top: 1px solid #26272b; padding: 22px 0;
  }
  .app h2 { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
  .app p { margin: 0 0 12px; color: #cfccc4; font-size: 15px; }
  a { color: #34e0a3; text-decoration: none; font-size: 14px; font-weight: 600; }
  a:hover { text-decoration: underline; }
  footer {
    border-top: 1px solid #26272b; margin-top: 24px; padding-top: 20px;
    color: #77756f; font-size: 13px;
  }
</style>
</head>
<body>
<main>
  <h1>비서 시리즈</h1>
  <p class="sub">일상의 작은 관리를 대신하는 안드로이드 앱입니다.</p>

  <div class="app">
    <h2>쿠폰비서</h2>
    <p>여기저기서 오는 쿠폰·기프티콘을 한 곳에 모아, 만료 전에 알려주고 달력으로 관리합니다.</p>
    <a href="https://play.google.com/store/apps/details?id=com.couponbiseo.app">Google Play에서 보기 →</a>
  </div>

  <div class="app">
    <h2>밥상비서</h2>
    <p>제철 장보기와 냉장고 관리를 돕고, 소비기한이 다가오면 알려줍니다.</p>
    <a href="https://play.google.com/store/apps/details?id=com.bapsangbiseo.app">Google Play에서 보기 →</a>
  </div>

  <div class="app">
    <h2>계산비서</h2>
    <p>실생활에 필요한 계산을 한 앱에 모았습니다.</p>
    <a href="https://play.google.com/store/apps/details?id=com.semii.calc">Google Play에서 보기 →</a>
  </div>

  <footer>
    광고 판매자 정보는 <a href="/app-ads.txt">app-ads.txt</a> 에 있습니다.
  </footer>
</main>
</body>
</html>
