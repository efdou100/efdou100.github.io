<script>
(() => {
'use strict';
const W = 360, H = 640, { DT, F, TR, SR, LEVELS } = SIM;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), wrap = $('wrap');
let scale = 1, pr = 1;

// ---------- 저장 ----------
const SAVE_KEY = 'echoArrow.v2';
let save = { stars: {}, sound: true };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.stars) save = { ...save, ...s }; } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
const unlocked = () => { let n = 0; while (n < LEVELS.length && save.stars[n]) n++; return Math.min(n, LEVELS.length - 1); };

// ---------- 사운드 (WebAudio 합성) ----------
let AC = null, master = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, dur, type = 'sine', vol = 0.25, f2 = null, delay = 0) {
  if (!AC || !save.sound) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, type = 'lowpass', delay = 0) {
  if (!AC || !save.sound) return;
  const t = AC.currentTime + delay, len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = type; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const SFX = {
  twang() { tone(220, 0.22, 'triangle', 0.3, 95); noise(0.09, 0.35, 3200, 'bandpass'); },
  echo() { tone(1320, 0.25, 'sine', 0.08, 990); tone(1980, 0.18, 'sine', 0.04, 1500, 0.03); },
  bounce(b) { const f = 480 * Math.pow(1.1225, Math.min(b, 14)); tone(f, 0.11, 'sine', 0.22); tone(f * 2, 0.06, 'triangle', 0.06); },
  stick(k) { noise(0.12, 0.5, k === 'g' ? 900 : 500); tone(k === 'g' ? 160 : 110, 0.12, 'sine', 0.25, 60); },
  sw() { [660, 880, 1320].forEach((f, i) => tone(f, 0.16, 'square', 0.06, null, i * 0.05)); },
  gate(open) { noise(0.35, 0.18, open ? 1800 : 700, 'bandpass'); tone(open ? 300 : 500, 0.3, 'sine', 0.08, open ? 600 : 250); },
  hit(n) { const base = 784 * Math.pow(1.26, n); tone(base, 0.35, 'sine', 0.24); tone(base * 1.5, 0.4, 'triangle', 0.1, null, 0.04); noise(0.06, 0.2, 6000, 'highpass'); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => { tone(f, 0.6, 'triangle', 0.14, null, i * 0.07); tone(f / 2, 0.6, 'sine', 0.07, null, i * 0.07); }); },
  fizzle() { noise(0.2, 0.12, 1200, 'bandpass'); },
  click() { tone(900, 0.05, 'square', 0.05); },
  ice() { noise(0.25, 0.4, 5000, 'highpass'); [1800, 2400, 1500].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, f * 0.7, i * 0.03)); },
  portal() { tone(300, 0.25, 'sine', 0.14, 900); tone(900, 0.25, 'sine', 0.06, 300, 0.05); },
  prism() { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.3, 'sine', 0.09, null, i * 0.035)); },
  shield() { tone(1400, 0.12, 'square', 0.06, 900); noise(0.05, 0.3, 7000, 'highpass'); },
  rotate() { tone(520, 0.08, 'triangle', 0.12, 780); noise(0.06, 0.12, 2500, 'bandpass'); },
  fail() { [392, 330, 262].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, null, i * 0.12)); },
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---------- 화면 크기 ----------
function resize() {
  const r = wrap.getBoundingClientRect();
  scale = Math.min(r.width / W, r.height / H);
  pr = scale * Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * pr); cv.height = Math.round(H * pr);
  stage.style.width = W * scale + 'px'; stage.style.height = H * scale + 'px';
  stage.style.setProperty('--s', scale);
  staticLayer = null;
}
window.addEventListener('resize', resize);

// ---------- 유틸 ----------
let seed = 1;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ---------- 게임 상태 ----------
const G = {
  li: 0, L: null, shots: [], bonus: 0, run: null, mode: 'menu', cur: null,
  ds: null, aim: { ang: -Math.PI / 2, pull: 0 }, acc: 0, endT: 0, finT: 0,
  slowT: 0, hitstop: 0, flash: 0, shake: 0, cam: { z: 1, x: W / 2, y: H / 2, tz: 1, tx: W / 2, ty: H / 2 },
  hold: 0, stats: null, gateVis: [], gateWas: [], trailsFull: false, fails: 0, adUsed: false, lastWinShots: null, t: 0,
};
const parts = [], rings = [], texts = [];
const COL_SHOT = ['#ffd36b', '#7ef0ff', '#b9a4ff', '#8dffb5', '#ff9fc8', '#ffb37e'];
const shotCol = (idx, curIdx) => (idx === curIdx ? COL_SHOT[0] : COL_SHOT[1 + (idx % 5)]);

function burst(x, y, col, n = 14, sp = 160, size = 3) {
  for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, v = sp * (0.35 + rnd() * 0.75); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.45 + rnd() * 0.4, t: 0, col, size: size * (0.6 + rnd() * 0.8) }); }
}
const ring = (x, y, col, r1 = 34, life = 0.4, w = 3) => rings.push({ x, y, col, r1, life, t: 0, w });
const ftext = (x, y, s, col = '#fff', size = 18, life = 1) => texts.push({ x, y, s, col, size, life, t: 0 });

// ---------- 스킬 ----------
const SKILL = {
  split: { name: '분열', desc: '분열 화살: 처음 튕길 때 세 갈래로 갈라져요', col: '#ffd36b' },
  pierce: { name: '관통', desc: '관통 화살: 이끼를 뚫고 지나가요', col: '#8dffb5' },
};
const WORLD = ['', '숲', '거울', '수정', '메아리'];
function skillChips() {
  return Object.keys(G.L.skills || {}).map((k, i) => ({ k, x: F.x0 + 10 + i * 78, y: F.y1 - 38, w: 72, h: 28 }));
}

// ---------- 흐름 ----------
function startLevel(li) {
  G.li = li; G.L = LEVELS[li]; G.shots = []; G.bonus = 0; G.adUsed = false; G.fails = 0;
  G.iceBlocks = (G.L.blocks || []).filter(b => b[4] === 'i');
  G.mirrors = SIM.defaultMirrors(G.L); G.skillLeft = { ...(G.L.skills || {}) }; G.kind = 'n';
  seed = 1234 + li * 77; staticLayer = null;
  hideAll(); startTurn(true);
}
function startTurn(first, quiet) {
  const L = G.L;
  G.run = SIM.newRun(L, G.shots.map(s => ({ ...s, echo: true })), G.mirrors);
  G.echoPrev = echoPreview();
  G.mode = 'aim'; G.cur = null; G.acc = 0; G.endT = 0; G.finT = 0; G.slowT = 0; G.hitstop = 0; G.hold = 0;
  G.cam.tz = 1; G.cam.tx = W / 2; G.cam.ty = H / 2;
  G.stats = { maxB: 0, tricks: 0, multi: 0 };
  G.gateVis = G.run.C.gates.map(() => 0); G.gateWas = G.run.C.gates.map(() => false);
  G.trailsFull = false;
  if (quiet) return;
  if (first && L.hint) toast(L.hint, 0, true);
  else if (G.shots.length) toast(`메아리 ${G.shots.length}개 대기 중 · 누르는 순간 지난 화살이 같은 타이밍에 다시 날아가요`, 0, false, true);
  else hideToast();
}
// 메아리 미리보기: 지난 화살들이 지금 거울 상태에서 어떻게 날아갈지
function echoPreview() {
  if (!G.shots.length) return [];
  const run = SIM.newRun(G.L, G.shots, G.mirrors), out = new Map();
  for (let i = 0; i < 1500 && !SIM.done(run); i++) {
    SIM.step(run, null);
    if (i % 3) continue;
    run.arrows.forEach((a, k) => { if (!a.alive) return; if (!out.has(a)) out.set(a, { idx: a.idx, pts: [] }); out.get(a).pts.push(a.x, a.y); });
  }
  return [...out.values()];
}

  btn(328, 42, (x, y) => { ctx.beginPath(); ctx.arc(x, y, 7, -0.3, Math.PI * 1.6); ctx.stroke(); ctx.fillStyle = '#eef2ff'; ctx.beginPath(); ctx.moveTo(x + 9.5, y - 6); ctx.lineTo(x + 5, y - 1); ctx.lineTo(x + 3, y - 7.5); ctx.closePath(); ctx.fill(); });

  ctx.fillStyle = G.L.par > 1 ? '#7ef0ff' : '#9aa6d6'; ctx.font = '700 11px Fredoka, sans-serif';
  ctx.fillText(`WORLD ${G.L.w} · ${WORLD[G.L.w]} · ${G.li + 1}`, W / 2, 28);
  ctx.fillStyle = '#eef2ff'; ctx.font = '20px Jua, sans-serif'; ctx.fillText(G.L.name, W / 2, 50);
  // 남은 화살

  }

}

// ---------- 메인 루프 ----------
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now; G.t += rdt;
  if (toastT > 0) { toastT -= rdt; if (toastT <= 0) hideToast(); }
  if (G.mode !== 'menu' && G.L) {
    if (!staticLayer) buildStatic();
    let ts = 0;
    if (G.mode === 'hold') ts = 0.32;
    else if (G.mode === 'fly' || G.mode === 'finish' || G.mode === 'over') ts = 1;
    else if (G.mode === 'replay') ts = 0.65;
    G.hold = lerp(G.hold, G.mode === 'hold' ? 1 : 0, 0.15);
    if (G.slowT > 0) { G.slowT -= rdt; ts *= 0.2; }
    if (G.hitstop > 0) { G.hitstop -= rdt; ts = 0; }
    if (G.run.won && G.finT > 1.3) ts = 0;
    G.acc += rdt * ts;
    let n = 0;
    while (G.acc >= DT && n < 60) {
      G.acc -= DT; n++;
      const ev = []; SIM.step(G.run, ev); onEvents(ev);
      for (const a of G.run.arrows) if (a.alive && a.tr) { a.tr.push(a.x, a.y); if (!G.trailsFull && a.tr.length > 44) a.tr.splice(0, 2); }
    }
    if (G.mode === 'fly' && SIM.done(G.run) && !G.run.won) { G.endT += rdt; if (G.endT > 0.5) endTurn(); }
    if (G.mode === 'finish') { G.finT += rdt; if (G.finT > 1.7 && $('clear').hidden) showClear(); }
    if (G.mode === 'replay') {
      if (G.run.won) G.finT += rdt;
      if (G.finT > 1.8 || (SIM.done(G.run) && !G.run.won)) { G.mode = 'finish'; G.finT = 2; G.trailsFull = false; showClear(); }
    }
    render(rdt);
  } else if (G.mode === 'menu') renderMenuBg(rdt);

}
function render(rdt) {
  const time = G.run.step * DT;

  ctx.drawImage(staticLayer, 0, 0, W, H);
  // 카메라
  const c = G.cam; c.z = lerp(c.z, c.tz, 0.08); c.x = lerp(c.x, c.tx, 0.08); c.y = lerp(c.y, c.ty, 0.08);
  if (G.finT > 1.3 || G.mode === 'over') { c.tz = 1; c.tx = W / 2; c.ty = H / 2; }
  G.shake *= 0.86; const sx = (Math.random() - 0.5) * G.shake, sy = (Math.random() - 0.5) * G.shake;
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(c.z, c.z); ctx.translate(-c.x, -c.y);
  if (c.z > 1.001) ctx.drawImage(staticLayer, 0, 0, W, H);
  drawGates(time); drawDevices(time); drawSwitches(time); drawTargets(time);
  drawEchoPreview(); drawArrows(); drawArcher(); drawGuide(); drawFx(rdt);
  ctx.restore();
  // 시간 느려짐 비네트
  if (G.hold > 0.01) {
    const v = ctx.createRadialGradient(W / 2, H / 2, 160, W / 2, H / 2, 420);
    v.addColorStop(0, 'rgba(10,30,60,0)'); v.addColorStop(1, `rgba(40,140,180,${0.45 * G.hold})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  // HUD 영역 배경
  const hg = ctx.createLinearGradient(0, 0, 0, F.y0); hg.addColorStop(0, 'rgba(10,12,40,0.9)'); hg.addColorStop(1, 'rgba(10,12,40,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, F.y0 - 2);
  drawHud(time);
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,248,220,${Math.min(0.8, G.flash)})`; ctx.fillRect(0, 0, W, H); G.flash -= rdt * 2.2; }
}
// 메뉴 배경: 화살이 벽에 튕기며 노니는 데모
const demo = { arrows: [] };
function renderMenuBg(rdt) {
  ctx.setTransform(pr, 0, 0, pr, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#151b4a'); bg.addColorStop(1, '#0b2b33');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (demo.arrows.length < 6 && Math.random() < 0.02) { const a = rnd() * Math.PI * 2; demo.arrows.push({ x: W / 2, y: H * 0.72, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, tr: [], life: 6, col: COL_SHOT[demo.arrows.length % 6] }); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = demo.arrows.length - 1; i >= 0; i--) {
    const a = demo.arrows[i]; a.life -= rdt; if (a.life <= 0) { demo.arrows.splice(i, 1); continue; }
    a.x += a.vx * rdt; a.y += a.vy * rdt;
    if (a.x < 8 || a.x > W - 8) { a.vx *= -1; a.x = clamp(a.x, 8, W - 8); }

// ---------- 시작 ----------

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { staticLayer = null; });
requestAnimationFrame(frame);

})();
