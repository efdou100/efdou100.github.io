<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Sniffy Pups</title>
<link rel="icon" href="icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(#B3E2FC, #DDF0C8 60%, #A9D88A); color: #4A3B33; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }

  a { color: #4A3B33; }
  .play { display: inline-block; margin-top: 18px; padding: 14px 26px; background: #FFC93C; border: 3px solid #4A3B33; border-radius: 22px; box-shadow: 0 4px 0 #4A3B33; text-decoration: none; font-weight: 700; }

<main>
  <img src="icon.png" alt="Sniffy Pups icon">
